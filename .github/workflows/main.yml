name: Build K Downloader installers

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Linux, headless)
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb ffmpeg

      - name: Install dependencies
        run: python -m pip install -r src/requirements.txt

      - name: Run tests
        run: xvfb-run -a python -m unittest discover -s tests -v

  build-windows:
    name: Windows Setup.exe
    needs: test
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify repository files
        shell: pwsh
        run: |
          $required = @(
            "src/playlist_downloader.py",
            "src/kdownloader/app_main.py",
            "src/requirements.txt",
            "assets/k_downloader.ico",
            "assets/k_downloader_logo.png",
            "windows/K-Downloader-Setup.iss"
          )
          foreach ($f in $required) {
            if (-not (Test-Path $f)) { throw "Missing required file: $f" }
          }

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r src/requirements.txt pyinstaller
          python -c "import customtkinter, yt_dlp, imageio_ffmpeg, PIL, tkinter; print('Dependencies import OK')"

      - name: Package app with PyInstaller
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --windowed `
            --name "K Downloader" `
            --icon "assets\k_downloader.ico" `
            --paths src `
            --add-data "assets\k_downloader_logo.png;." `
            --add-data "assets\k_downloader.ico;." `
            --collect-all customtkinter `
            --collect-all imageio_ffmpeg `
            --collect-all yt_dlp `
            --hidden-import tkinter `
            --hidden-import tkinter.filedialog `
            --hidden-import tkinter.messagebox `
            src\playlist_downloader.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "dist\K Downloader\K Downloader.exe")) { throw "PyInstaller did not produce dist\K Downloader\K Downloader.exe" }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          function Find-Iscc {
            foreach ($root in @(${env:ProgramFiles(x86)}, $env:ProgramFiles)) {
              if (-not $root) { continue }
              $dir = Get-ChildItem -Path $root -Directory -Filter "Inno Setup*" -ErrorAction SilentlyContinue |
                Sort-Object Name -Descending | Select-Object -First 1
              if ($dir -and (Test-Path (Join-Path $dir.FullName "ISCC.exe"))) {
                return (Join-Path $dir.FullName "ISCC.exe")
              }
            }
            return $null
          }
          $iscc = Find-Iscc
          if (-not $iscc) {
            choco install innosetup --yes --no-progress
            $iscc = Find-Iscc
          }
          if (-not $iscc) { throw "ISCC.exe (Inno Setup compiler) not found" }
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Using $iscc"

      - name: Build Windows installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release/windows | Out-Null
          & $env:ISCC "windows\K-Downloader-Setup.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "release\windows\K-Downloader-Windows-Setup.exe")) { throw "Installer K-Downloader-Windows-Setup.exe was not produced" }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: K-Downloader-Windows-Setup
          path: release/windows/K-Downloader-Windows-Setup.exe
          if-no-files-found: error

  build-macos:
    name: macOS DMG (${{ matrix.label }})
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-13 was retired by GitHub in Dec 2025; macos-15-intel is the Intel runner.
          - runner: macos-15-intel
            label: Intel
            machine: x86_64
          - runner: macos-15
            label: Apple-Silicon
            machine: arm64
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify runner architecture and repository files
        shell: bash
        run: |
          test "$(uname -m)" = "${{ matrix.machine }}" || { echo "Expected ${{ matrix.machine }}, got $(uname -m)"; exit 1; }
          for f in src/playlist_downloader.py src/kdownloader/app_main.py src/requirements.txt assets/k_downloader_logo.png; do
            test -f "$f" || { echo "Missing required file: $f"; exit 1; }
          done

      - name: Install dependencies
        shell: bash
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r src/requirements.txt pyinstaller
          python3 -c "import customtkinter, yt_dlp, imageio_ffmpeg, PIL, tkinter; print('Dependencies import OK')"

      - name: Create macOS icon from logo
        shell: bash
        run: |
          mkdir -p build/kaushan.iconset
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          im = Image.open("assets/k_downloader_logo.png").convert("RGBA")
          sizes = {
              "icon_16x16.png": 16, "icon_16x16@2x.png": 32,
              "icon_32x32.png": 32, "icon_32x32@2x.png": 64,
              "icon_128x128.png": 128, "icon_128x128@2x.png": 256,
              "icon_256x256.png": 256, "icon_256x256@2x.png": 512,
              "icon_512x512.png": 512, "icon_512x512@2x.png": 1024,
          }
          out = Path("build/kaushan.iconset")
          for name, size in sizes.items():
              im.resize((size, size), Image.Resampling.LANCZOS).save(out / name)
          PY
          iconutil -c icns build/kaushan.iconset -o assets/k_downloader.icns
          test -f assets/k_downloader.icns

      - name: Package app with PyInstaller
        shell: bash
        run: |
          python3 -m PyInstaller --noconfirm --clean --windowed \
            --name "K Downloader" \
            --icon "assets/k_downloader.icns" \
            --paths src \
            --osx-bundle-identifier com.kaushan.kdownloader \
            --add-data "assets/k_downloader_logo.png:." \
            --collect-all customtkinter \
            --collect-all imageio_ffmpeg \
            --collect-all yt_dlp \
            --hidden-import tkinter \
            --hidden-import tkinter.filedialog \
            --hidden-import tkinter.messagebox \
            src/playlist_downloader.py
          test -d "dist/K Downloader.app" || { echo "PyInstaller did not produce dist/K Downloader.app"; exit 1; }

      - name: Build DMG
        shell: bash
        run: |
          mkdir -p release/macos build/dmg_root
          cp -R "dist/K Downloader.app" build/dmg_root/
          ln -s /Applications build/dmg_root/Applications
          hdiutil create -volname "K Downloader" \
            -srcfolder build/dmg_root -ov -format UDZO \
            "release/macos/K-Downloader-macOS-${{ matrix.label }}.dmg"
          test -f "release/macos/K-Downloader-macOS-${{ matrix.label }}.dmg"

      - name: Upload macOS disk image
        uses: actions/upload-artifact@v4
        with:
          name: K-Downloader-macOS-${{ matrix.label }}
          path: release/macos/K-Downloader-macOS-${{ matrix.label }}.dmg
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -l release-files
          gh release create "$TAG" release-files/* --repo "$GITHUB_REPOSITORY" --title "K Downloader $TAG" \
            --notes "Unsigned builds. Windows may show SmartScreen and macOS may show an unidentified-developer warning; see README.md for how to open them."
