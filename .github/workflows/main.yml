name: Build K Downloader installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-windows:
    name: Windows Setup.exe
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies and package app
        shell: cmd
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r src\requirements.txt pyinstaller
          python -m PyInstaller --noconfirm --clean --windowed ^
            --name "K Downloader" ^
            --icon "assets\k_downloader.ico" ^
            --add-data "assets\k_downloader_logo.png;." ^
            --collect-all customtkinter ^
            --collect-all imageio_ffmpeg ^
            --collect-all yt_dlp ^
            --hidden-import tkinter ^
            --hidden-import tkinter.filedialog ^
            --hidden-import tkinter.messagebox ^
            src\playlist_downloader.py

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build Setup.exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release/windows | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" windows/K-Downloader-Setup.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: K-Downloader-Windows-Setup
          path: release/windows/*.exe
          if-no-files-found: error

  build-macos:
    name: macOS DMG (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-13
            arch: x86_64
          - runner: macos-14
            arch: arm64
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build macOS app and DMG
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r src/requirements.txt pyinstaller
          mkdir -p build/kaushan.iconset release/macos
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          im = Image.open("assets/k_downloader_logo.png").convert("RGBA")
          sizes = {
              "icon_16x16.png":16, "icon_16x16@2x.png":32,
              "icon_32x32.png":32, "icon_32x32@2x.png":64,
              "icon_128x128.png":128, "icon_128x128@2x.png":256,
              "icon_256x256.png":256, "icon_256x256@2x.png":512,
              "icon_512x512.png":512,
          }
          out = Path("build/kaushan.iconset")
          for name, size in sizes.items():
              im.resize((size, size), Image.Resampling.LANCZOS).save(out / name)
          PY
          iconutil -c icns build/kaushan.iconset -o assets/k_downloader.icns
          python -m PyInstaller --noconfirm --clean --windowed \
            --name "K Downloader" \
            --icon "assets/k_downloader.icns" \
            --add-data "assets/k_downloader_logo.png:." \
            --collect-all customtkinter \
            --collect-all imageio_ffmpeg \
            --collect-all yt_dlp \
            --hidden-import tkinter \
            --hidden-import tkinter.filedialog \
            --hidden-import tkinter.messagebox \
            src/playlist_downloader.py
          hdiutil create -volname "K Downloader" \
            -srcfolder "dist/K Downloader.app" -ov -format UDZO \
            "release/macos/K-Downloader-2.3.1-${{ matrix.arch }}.dmg"

      - name: Upload macOS disk image
        uses: actions/upload-artifact@v4
        with:
          name: K-Downloader-macOS-${{ matrix.arch }}
          path: release/macos/*.dmg
          if-no-files-found: error
